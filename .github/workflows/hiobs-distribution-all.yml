name: HIOBS 144 isolated generation and validation
on:
  push:
    branches: [feature/hiobs-distribution-144]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve all existing website core files
        run: |
          git fetch origin main
          git diff --exit-code origin/main -- styles.css hiobs.js hiobs-data.js hiobs-sources.js
          git diff --exit-code origin/main -- observations/rolex/immune/index.html observations/assets/rolex-immune-og.png
      - name: Build all remaining observation endpoints
        run: node scripts/build-hiobs-all.mjs
      - name: Build previews from the twelve website palettes
        run: |
          python3 -m pip install --user Pillow==11.3.0
          python3 scripts/build-hiobs-images.py
      - name: Audit every page, URL, original text, citation and PNG
        run: node scripts/validate-hiobs-all.mjs
      - name: Stage generated output on the isolated branch
        run: |
          git add -- observations/ scripts/hiobs-distribution-manifest.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate validated 143 HIOBS pages and previews"
            git push origin HEAD:refs/heads/feature/hiobs-distribution-144
          fi
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run full desktop/mobile HIOBS regression
        run: node tests/hiobs-distribution-all.mjs
      - name: Upload visual QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiobs-144-visual-checks
          path: tests/artifacts/
          if-no-files-found: ignore
