<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Begin a Conversation — Human Inc.</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="contact-page">

    <header class="page-header">

      <nav class="territory-nav" aria-label="Human Inc.">
        <a href="index.html">HUMAN INC.</a>
        <a href="hisc.html">HISC</a>
        <a href="hiobs.html">HIOBS</a>
        <a href="hiff.html">HIFF</a>
      </nav>

    </header>


    <section class="contact-heading">

      <h1>Begin a Conversation</h1>

     <p>
  Something brought you this far. Tell us what has your attention,
  or the kind of engagement you’re considering. A few lines are enough.
</p>

    </section>


    <section class="contact-form-section">

      <form class="contact-form" id="contact-form">

        <div class="contact-field">

          <label for="name">
            Name
          </label>

          <input
            type="text"
            id="name"
            name="name"
            required
          >

        </div>


        <div class="contact-field">

          <label for="email">
            Email
          </label>

          <input
            type="email"
            id="email"
            name="email"
            required
          >

        </div>


        <div class="contact-field">

          <label for="organization">
            Organization
          </label>

          <input
            type="text"
            id="organization"
            name="organization"
          >

        </div>

        <div class="contact-field">

  <label for="phone">
    Phone
  </label>

  <input
    type="tel"
    id="phone"
    name="phone"
    autocomplete="tel"
  >

</div>

        <div class="contact-field">

          <label for="interest">
            What brings you here?
          </label>

          <select
            id="interest"
            name="interest"
            required
          >

            <option value="" selected disabled>
              Select
            </option>

            <option value="conversation">
              Conversation
            </option>

            <option value="keynote">
              Keynote
            </option>

            <option value="workshop">
              Workshop
            </option>

            <option value="executive">
              Executive Engagement
            </option>

            <option value="preorder">
  Pre-order Human Inc.: Structural Coherence
            </option>

            <option value="other">
              Other
            </option>

          </select>

        </div>


        <div class="contact-field contact-field-wide">

          <label for="message">
            What would you like to explore?
          </label>

          <textarea
            id="message"
            name="message"
            rows="7"
            required
          ></textarea>

        </div>


        <div class="contact-submit">

          <button type="submit">
            SEND
          </button>

        </div>

      </form>

    </section>


    <footer class="territory-footer">

      <nav class="territory-nav footer-nav" aria-label="Human Inc.">
        <a href="index.html">HUMAN INC.</a>
        <a href="hisc.html">HISC</a>
        <a href="hiobs.html">HIOBS</a>
        <a href="hiff.html">HIFF</a>
      </nav>

    </footer>

  </main>


  <script>

    const params = new URLSearchParams(window.location.search);
    const interest = params.get("interest");

    const interestField = document.getElementById("interest");

    const validInterests = [
      "conversation",
      "keynote",
      "workshop",
      "executive",
      "hiobs",
      "other"
    ];

    if (interest && validInterests.includes(interest)) {
      interestField.value = interest;
    }

  </script>

</body>
</html>
